name: Docker Push

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which image to build and push'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - ubuntu
          - alpine

# Multi-arch build strategy:
#   1. Per-arch job runs on a NATIVE runner (ubuntu-22.04 for amd64,
#      ubuntu-22.04-arm for arm64) and pushes an image-by-digest to Docker Hub.
#   2. A merge job pulls the two digests and joins them into a single
#      multi-arch manifest under the real tags (latest, <sha>).
#   This replaces the old single-job QEMU cross-build which was ~5-10x slower
#   on the arm64 leg (heavy: mariadb + openssl + luarocks + lua source builds).
#
# Reference: https://docs.docker.com/build/ci/github-actions/multi-platform/

jobs:
  check-changes:
    runs-on: ubuntu-22.04
    if: github.event_name == 'schedule'
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Check for commits in the past week
      id: check
      run: |
        if git log --since="7 days ago" --oneline | grep -q .; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi

  # ---------------- Ubuntu ----------------
  build-ubuntu:
    needs: [check-changes]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'ubuntu') ||
        github.event_name == 'schedule' && needs.check-changes.outputs.has_changes == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.ubuntu
        platforms: ${{ matrix.platform }}
        # push-by-digest: no tag; merge job below assembles the manifest
        outputs: type=image,name=luafan/luafan-ubuntu,push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=ubuntu-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=ubuntu-${{ matrix.arch }}

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-ubuntu-${{ matrix.arch }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge-ubuntu:
    needs: [build-ubuntu]
    # Explicit gate: GHA's default success() propagates transitive 'skipped'
    # from check-changes on workflow_dispatch; we only care whether the
    # direct build actually succeeded.
    if: always() && needs.build-ubuntu.result == 'success'
    runs-on: ubuntu-22.04
    steps:
    - name: Download digests
      uses: actions/download-artifact@v4
      with:
        path: /tmp/digests
        pattern: digests-ubuntu-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Create manifest and push
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create \
          -t luafan/luafan-ubuntu:latest \
          -t luafan/luafan-ubuntu:${{ github.sha }} \
          $(printf 'luafan/luafan-ubuntu@sha256:%s ' *)

    - name: Inspect image
      run: |
        docker buildx imagetools inspect luafan/luafan-ubuntu:latest

  # ---------------- Alpine ----------------
  build-alpine:
    needs: [check-changes]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'alpine') ||
        github.event_name == 'schedule' && needs.check-changes.outputs.has_changes == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.alpine
        platforms: ${{ matrix.platform }}
        outputs: type=image,name=luafan/luafan-alpine,push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=alpine-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=alpine-${{ matrix.arch }}

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-alpine-${{ matrix.arch }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge-alpine:
    needs: [build-alpine]
    # Explicit gate: GHA's default success() propagates transitive 'skipped'
    # from check-changes on workflow_dispatch; we only care whether the
    # direct build actually succeeded.
    if: always() && needs.build-alpine.result == 'success'
    runs-on: ubuntu-22.04
    steps:
    - name: Download digests
      uses: actions/download-artifact@v4
      with:
        path: /tmp/digests
        pattern: digests-alpine-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Create manifest and push
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create \
          -t luafan/luafan-alpine:latest \
          -t luafan/luafan-alpine:${{ github.sha }} \
          $(printf 'luafan/luafan-alpine@sha256:%s ' *)

    - name: Inspect image
      run: |
        docker buildx imagetools inspect luafan/luafan-alpine:latest
