name: Docker Push

on:
  workflow_run:
    workflows: ["LuaFan CI"]
    types: [completed]
    branches: [master]

# Images are published only for a successful CI push on master. The workflow
# checks the source run's event explicitly so pull-request CI cannot publish.
permissions:
  contents: read

# Multi-arch build strategy:
#   1. Per-arch job runs on a NATIVE runner (ubuntu-22.04 for amd64,
#      ubuntu-22.04-arm for arm64) and pushes an image-by-digest to Docker Hub.
#   2. A merge job pulls the two digests and joins them into a single
#      multi-arch manifest under the real tags (latest, <sha>).
#   This replaces the old single-job QEMU cross-build which was ~5-10x slower
#   on the arm64 leg (heavy: mariadb + openssl + luarocks + lua source builds).
#
# Reference: https://docs.docker.com/build/ci/github-actions/multi-platform/

jobs:
  # ---------------- Ubuntu ----------------
  build-ubuntu:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout tested commit
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.ubuntu
        platforms: ${{ matrix.platform }}
        # push-by-digest: no tag; merge job below assembles the manifest
        outputs: type=image,name=luafan/luafan-ubuntu,push-by-digest=true,name-canonical=true,push=true
        no-cache: true
        pull: true

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-ubuntu-${{ matrix.arch }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge-ubuntu:
    needs: [build-ubuntu]
    if: needs.build-ubuntu.result == 'success'
    runs-on: ubuntu-22.04
    steps:
    - name: Download digests
      uses: actions/download-artifact@v4
      with:
        path: /tmp/digests
        pattern: digests-ubuntu-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Create manifest and push
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create \
          -t luafan/luafan-ubuntu:latest \
          -t luafan/luafan-ubuntu:${{ github.event.workflow_run.head_sha }} \
          $(printf 'luafan/luafan-ubuntu@sha256:%s ' *)

    - name: Inspect image
      run: |
        docker buildx imagetools inspect luafan/luafan-ubuntu:latest

    - name: Trigger webase ubuntu rebuild
      env:
        GH_TOKEN: ${{ secrets.WEBASE_DISPATCH_TOKEN }}
      run: |
        curl -fsSL -X POST \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/luafan/webase/dispatches \
          -d '{"event_type":"luafan-ubuntu-updated","client_payload":{"luafan_sha":"${{ github.event.workflow_run.head_sha }}"}}'

  # ---------------- Alpine ----------------
  build-alpine:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout tested commit
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.alpine
        platforms: ${{ matrix.platform }}
        outputs: type=image,name=luafan/luafan-alpine,push-by-digest=true,name-canonical=true,push=true
        no-cache: true
        pull: true

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-alpine-${{ matrix.arch }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge-alpine:
    needs: [build-alpine]
    if: needs.build-alpine.result == 'success'
    runs-on: ubuntu-22.04
    steps:
    - name: Download digests
      uses: actions/download-artifact@v4
      with:
        path: /tmp/digests
        pattern: digests-alpine-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Create manifest and push
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create \
          -t luafan/luafan-alpine:latest \
          -t luafan/luafan-alpine:${{ github.event.workflow_run.head_sha }} \
          $(printf 'luafan/luafan-alpine@sha256:%s ' *)

    - name: Inspect image
      run: |
        docker buildx imagetools inspect luafan/luafan-alpine:latest

    - name: Trigger webase alpine rebuild
      env:
        GH_TOKEN: ${{ secrets.WEBASE_DISPATCH_TOKEN }}
      run: |
        curl -fsSL -X POST \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/luafan/webase/dispatches \
          -d '{"event_type":"luafan-alpine-updated","client_payload":{"luafan_sha":"${{ github.event.workflow_run.head_sha }}"}}'
