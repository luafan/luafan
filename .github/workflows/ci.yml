name: LuaFan CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-alpine:
    runs-on: ubuntu-22.04
    container:
      image: alpine:3.16.9

    steps:
    - name: Install git
      run: apk add --update git

    - name: Checkout code
      uses: actions/checkout@v6

    - name: Build LuaFan (Alpine)
      run: |
        cd $GITHUB_WORKSPACE
        sh build_docker_alpine.sh || exit -1

    - name: Build completion
      run: echo "Build Alpine finished!"

  build-ubuntu:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04

    steps:
    - name: Install git
      run: apt update && apt install -y git

    - name: Checkout code
      uses: actions/checkout@v6

    - name: Build LuaFan (Ubuntu)
      run: |
        cd $GITHUB_WORKSPACE
        bash build_docker_ubuntu.sh || exit -1

    - name: Build completion
      run: echo "Build Ubuntu finished!"

  # Run the comprehensive suite inside a clean container so the build and
  # test-time CMake configure cannot see the GitHub runner's MySQL client.
  test-comprehensive:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04
    timeout-minutes: 10
    needs: [build-ubuntu]

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install test dependencies
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y \
          build-essential cmake pkg-config wget ca-certificates \
          liblua5.3-dev libssl-dev libcurl4-openssl-dev \
          libevent-dev libncurses-dev libncurses5-dev lua5.3 bison \
          luarocks zlib1g-dev libsqlite3-dev
        luarocks install lzlib
        luarocks install lua-cjson 2.1.0-1
        luarocks install luafilesystem
        luarocks install lsqlite3

    - name: Build MariaDB client from source
      env:
        MARIADB_PREFIX: /opt/luafan/mariadb-client
      run: |
        MARIADB_VERSION=5.5.68
        wget https://github.com/MariaDB/server/archive/mariadb-$MARIADB_VERSION.tar.gz
        tar xzf mariadb-$MARIADB_VERSION.tar.gz
        cd server-mariadb-$MARIADB_VERSION
        cmake . \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DCMAKE_INSTALL_PREFIX=$MARIADB_PREFIX \
          -DDISABLE_LIBMYSQLCLIENT_SYMBOL_VERSIONING=TRUE
        cd libmysql && make -j$(nproc) install
        cd ../include && make install
        test -f "$MARIADB_PREFIX/include/mysql/mysql.h"
        test -f "$MARIADB_PREFIX/lib/libmysqlclient.so"
        grep -q 'MYSQL_WAIT_READ' "$MARIADB_PREFIX/include/mysql/mysql.h"
        grep -q 'mysql_get_socket' "$MARIADB_PREFIX/include/mysql/mysql.h"
        cd ../..
        rm -rf mariadb-$MARIADB_VERSION.tar.gz server-mariadb-$MARIADB_VERSION

    - name: Build hooked Lua interpreter
      run: |
        # This job runs inside a root container, so installing into /usr/local
        # (bin/lua and include/luaconf.h) needs no privilege escalation -- and
        # the image has no sudo(8).
        bash tests/build_hooked_lua.sh 5.3.3 src /usr/local

    - name: Run comprehensive tests
      env:
        MARIADB_PREFIX: /opt/luafan/mariadb-client
        MYSQL_INCLUDE_DIR: /opt/luafan/mariadb-client/include
        MYSQL_CLIENT_LIBRARY: /opt/luafan/mariadb-client/lib/libmysqlclient.so
        LD_LIBRARY_PATH: /opt/luafan/mariadb-client/lib
        # Exercise the same lock semantics as LuanMac/release images: the
        # interpreter is built with the global lua_lock hook (see
        # tests/build_hooked_lua.sh), so fan.so must not carry its own lock copy
        # and must compile the lock diagnostics used by the worker test below.
        LUAFAN_CORE_LOCK_HOOK: "ON"
        LUAFAN_TESTING: "ON"
        LUAFAN_LUA_BIN: /usr/local/bin/lua
      run: |
        export PATH=/usr/local/bin:$PATH
        lua -v
        cd tests
        chmod +x run_all_tests.sh
        ./run_all_tests.sh --verbose

    # Worker-pool suites are standalone scripts (they need the pool before
    # fan.loop), so run the lock one explicitly: it asserts the hooked build
    # reports "core-hook" and that its granularity is what that implies.
    - name: Run lock granularity test
      env:
        LUAN_TEST_WORKERS: "4"
        LUAN_LOCK_MODE_EXPECT: core-hook
      run: |
        export PATH=/usr/local/bin:$PATH
        cd tests
        export LUA_PATH="$PWD/../modules/?.lua;$PWD/../modules/?/init.lua;$PWD/lua/framework/?.lua;$PWD/lua/?.lua;;"
        export LUA_CPATH="$PWD/build/?.so;$PWD/../?.so;;"
        lua lua/test_lock_granularity.lua
