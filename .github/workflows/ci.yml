name: LuaFan CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-alpine:
    runs-on: ubuntu-22.04
    container:
      image: alpine:3.16.9

    steps:
    - name: Install git
      run: apk add --update git

    - name: Checkout code
      uses: actions/checkout@v6

    - name: Build LuaFan (Alpine)
      run: |
        cd $GITHUB_WORKSPACE
        sh build_docker_alpine.sh || exit -1

    - name: Build completion
      run: echo "Build Alpine finished!"

  build-ubuntu:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04

    steps:
    - name: Install git
      run: apt update && apt install -y git

    - name: Checkout code
      uses: actions/checkout@v6

    - name: Build LuaFan (Ubuntu)
      run: |
        cd $GITHUB_WORKSPACE
        bash build_docker_ubuntu.sh || exit -1

    - name: Build completion
      run: echo "Build Ubuntu finished!"

  # Additional job for running tests using our comprehensive test suite
  test-comprehensive:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [build-ubuntu]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake pkg-config wget \
          liblua5.3-dev libssl-dev libcurl4-openssl-dev \
          libevent-dev libncurses-dev libncurses5-dev lua5.3 bison \
          luarocks zlib1g-dev libsqlite3-dev
        sudo luarocks install lzlib
        sudo luarocks install lua-cjson 2.1.0-1
        sudo luarocks install lsqlite3

    - name: Build MariaDB client from source
      run: |
        MARIADB_VERSION=5.5.68
        MARIADB_PREFIX=/opt/luafan/mariadb-client
        wget https://github.com/MariaDB/server/archive/mariadb-$MARIADB_VERSION.tar.gz
        tar xzf mariadb-$MARIADB_VERSION.tar.gz
        cd server-mariadb-$MARIADB_VERSION
        cmake . \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DCMAKE_INSTALL_PREFIX=$MARIADB_PREFIX \
          -DDISABLE_LIBMYSQLCLIENT_SYMBOL_VERSIONING=TRUE
        cd libmysql && sudo make -j$(nproc) install
        cd ../include && sudo make install
        test -f "$MARIADB_PREFIX/include/mysql/mysql.h"
        test -f "$MARIADB_PREFIX/lib/libmysqlclient.so"
        cd ../..
        sudo rm -rf mariadb-$MARIADB_VERSION.tar.gz server-mariadb-$MARIADB_VERSION

    - name: Build for testing
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Debug \
          -DMYSQL_INCLUDE_DIR=/opt/luafan/mariadb-client/include \
          -DMYSQL_CLIENT_LIBRARY=/opt/luafan/mariadb-client/lib/libmysqlclient.so
        make -j$(nproc)

    - name: Run comprehensive tests
      env:
        LD_LIBRARY_PATH: /opt/luafan/mariadb-client/lib
      run: |
        cd tests
        chmod +x run_all_tests.sh
        ./run_all_tests.sh --verbose
